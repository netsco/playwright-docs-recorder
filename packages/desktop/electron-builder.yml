appId: com.docrecorder.app
productName: Documentation Recorder
electronVersion: "40.0.0"

directories:
  output: dist

# Include source code and node_modules (prebuild script populates this)
files:
  - src/**/*
  - node_modules/**/*
  - "!**/*.map"
  - "!**/__tests__/**"
  - "!**/refetch.js"

# Don't let electron-builder manage dependencies - we handle it ourselves
npmRebuild: false
buildDependenciesFromSource: false
afterPack: "./scripts/afterPack.js"

win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  icon: assets/icons/icon.ico
  artifactName: DocRecorder-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: DocRecorder-Setup-${version}.exe

portable:
  artifactName: DocRecorder-Portable-${version}.exe
  requestExecutionLevel: user

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/icon.icns
  artifactName: DocRecorder-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools

dmg:
  artifactName: DocRecorder-${version}-mac-${arch}.dmg

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: assets/icons
  artifactName: DocRecorder-${version}-linux-${arch}.${ext}
  category: Development

appImage:
  artifactName: DocRecorder-${version}-linux.AppImage

deb:
  artifactName: DocRecorder-${version}-linux.deb

# asar disabled - afterPack hook replaces node_modules after copying
asar: false
compression: maximum
