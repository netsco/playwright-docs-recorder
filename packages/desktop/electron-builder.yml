appId: com.docrecorder.app
productName: Documentation Recorder
electronVersion: "28.0.0"

directories:
  output: dist

files:
  - src/**/*
  - "!**/*.map"
  - "!**/__tests__/**"
  - "!**/refetch.js"
  - from: "../../node_modules/@doc-recorder/shared"
    to: "node_modules/@doc-recorder/shared"
    filter:
      - "**/*"
      - "!__tests__/**"
      - "!refetch.js"
  - from: "../../node_modules/electron-store"
    to: "node_modules/electron-store"
  - from: "../../node_modules/conf"
    to: "node_modules/conf"
  - from: "../../node_modules/atomically"
    to: "node_modules/atomically"
  - from: "../../node_modules/dot-prop"
    to: "node_modules/dot-prop"
  - from: "../../node_modules/env-paths"
    to: "node_modules/env-paths"
  - from: "../../node_modules/json-schema-typed"
    to: "node_modules/json-schema-typed"
  - from: "../../node_modules/ajv"
    to: "node_modules/ajv"
  - from: "../../node_modules/ajv-formats"
    to: "node_modules/ajv-formats"
  - from: "../../node_modules/debounce-fn"
    to: "node_modules/debounce-fn"
  - from: "../../node_modules/semver"
    to: "node_modules/semver"
  - from: "../../node_modules/mimic-fn"
    to: "node_modules/mimic-fn"

win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  icon: assets/icons/icon.ico
  artifactName: DocRecorder-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: DocRecorder-Setup-${version}.exe

portable:
  artifactName: DocRecorder-Portable-${version}.exe
  requestExecutionLevel: user

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/icon.icns
  artifactName: DocRecorder-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools

dmg:
  artifactName: DocRecorder-${version}-mac-${arch}.dmg

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: assets/icons
  artifactName: DocRecorder-${version}-linux-${arch}.${ext}
  category: Development

appImage:
  artifactName: DocRecorder-${version}-linux.AppImage

deb:
  artifactName: DocRecorder-${version}-linux.deb

asar: true
compression: maximum

# Disable auto-publish (uncomment and configure when ready)
# publish:
#   provider: github
#   releaseType: release
