# Moat security-posture check overrides for playwright-docs-recorder.
# Reference: https://github.com/laravel/moat
#
# Disabled checks render as SKIPPED and do not count toward the failure total.

[checks]
# Release assets are produced by CI (electron-builder) on tag pushes and are not
# a published software-supply-chain artifact consumed by third parties, so
# release-asset immutability is not enforced here.
repositories_releases_are_immutable = "off"

# This is a small internally-maintained tool released via direct pushes and tag
# pushes to main, not a multi-contributor project. Requiring pull-request reviews
# and signed commits on the release branch would block that workflow without a
# meaningful threat-model benefit. Branch lock + linear history are still enforced
# via a repository ruleset.
repositories_pull_requests_require_reviews = "off"
repositories_commits_are_signed = "off"

# release-desktop.yml must publish GitHub Release assets via electron-builder,
# which requires `contents: write` on the GITHUB_TOKEN — there is no way to
# publish a release without it. Write is already scoped to the single publishing
# job (the workflow default and ci.yml are `contents: read`), so the blast radius
# is minimal, but moat flags any write grant. Waived as unavoidable for a
# release-publishing workflow.
repositories_workflow_permissions_are_restricted = "off"
