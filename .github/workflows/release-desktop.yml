name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    # Publishing the release (electron-builder --publish) needs write access;
    # scope it to this job so the workflow default stays least-privilege.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        working-directory: packages/desktop
        run: npm run build:renderer

      - name: Setup production dependencies
        working-directory: packages/desktop
        run: npm run prebuild

      - name: Install 7-Zip (Windows)
        if: matrix.platform == 'win'
        run: |
          choco install 7zip -y
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        working-directory: packages/desktop
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install 7-Zip (macOS)
        if: matrix.platform == 'mac'
        run: brew install p7zip

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        working-directory: packages/desktop
        run: npx electron-builder --mac --publish always
        env:
          USE_SYSTEM_7ZA: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install 7-Zip (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: packages/desktop
        run: npx electron-builder --linux --publish always
        env:
          USE_SYSTEM_7ZA: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
