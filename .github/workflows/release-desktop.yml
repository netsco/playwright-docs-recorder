name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: packages/desktop
        run: npm run css:build

      - name: Setup production dependencies
        working-directory: packages/desktop
        run: npm run prebuild

      - name: Install 7-Zip (Windows)
        if: matrix.platform == 'win'
        run: |
          choco install 7zip -y
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        working-directory: packages/desktop
        run: npx electron-builder --win --publish never

      - name: Install 7-Zip (macOS)
        if: matrix.platform == 'mac'
        run: brew install p7zip

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        working-directory: packages/desktop
        run: npx electron-builder --mac --publish never
        env:
          USE_SYSTEM_7ZA: true

      - name: Install 7-Zip (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: packages/desktop
        run: npx electron-builder --linux --publish never
        env:
          USE_SYSTEM_7ZA: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version || 'manual-build' }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Documentation Recorder ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
